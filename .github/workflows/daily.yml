name: Coleta diária de preços

on:
  schedule:
    # 10:47 UTC = 07:47 em Brasília (minuto quebrado evita a fila do horário cheio)
    - cron: "47 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar, analisar e enviar e-mail
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m tracker.main

      - name: Salvar dados no repositório (atualiza o GitHub Pages)
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.sqlite docs/data/
          git diff --cached --quiet || git commit -m "dados: $(TZ=America/Sao_Paulo date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
